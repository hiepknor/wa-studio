[package]
name = "wa-studio"
version = "0.2.2"
description = "Desktop operations client for WA Runtime"
authors = ["hiepknor"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wa_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
age = "0.12.1"
base64 = "0.22"
fs2 = "0.4.3"
dirs = "6.0.0"
keyring = "4.1.6"
rand = "0.10.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17.14"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["blocking", "bundled", "theseus", "tls-rustls-ring"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }

[dev-dependencies]
tempfile = "3.27.0"
