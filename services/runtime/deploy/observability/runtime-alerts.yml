groups:
  - name: wa-runtime-availability
    rules:
      - alert: WARuntimeScrapeMissing
        expr: up{job="wa-runtime"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime metrics target is unavailable
          description: Prometheus has been unable to scrape WA Runtime for two minutes.

      - alert: WARuntimeDependencyUnavailable
        expr: wa_runtime_dependency_up{job="wa-runtime"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime dependency probe is failing
          description: The {{ $labels.dependency }} dependency has failed every scrape for two minutes.

      - alert: WARuntimeBackgroundProcessDegraded
        expr: wa_runtime_background_process_up{job="wa-runtime"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime background process heartbeat is stale
          description: The {{ $labels.process }} heartbeat has been stale for two minutes.

      - alert: WARuntimeMetricsSnapshotFailures
        expr: increase(wa_runtime_metrics_snapshot_failures_total{job="wa-runtime"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime metric snapshots are failing
          description: The {{ $labels.dependency }} snapshot probe failed during the last five minutes.

      - alert: WARuntimeDatabasePoolSaturated
        expr: wa_runtime_database_pool_waiting_requests{job="wa-runtime"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime PostgreSQL pool is saturated
          description: Requests have waited for a database connection continuously for five minutes.

  - name: wa-runtime-openwa-safety
    rules:
      - alert: WARuntimeOpenWAUnknownMessageJobs
        expr: sum(wa_runtime_openwa_unknown_message_jobs{job="wa-runtime"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime contains an ambiguous outbound result
          description: At least one Message Job crossed dispatch without definitive terminal evidence; stop new live campaigns and reconcile it without retrying.

      - alert: WARuntimeWebhookDeadEvents
        expr: sum(wa_runtime_webhook_spool_events{job="wa-runtime",state="dead"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime contains unreconciled dead webhooks
          description: At least one authenticated webhook exhausted processing retries; stop promotion and reconcile the retained envelope before resuming unattended operation.

      - alert: WARuntimeWebhookSpoolAdmissionUnavailable
        expr: wa_runtime_webhook_spool_admission_available{job="wa-runtime"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime webhook spool cannot safely admit a callback
          description: The Runtime cannot reserve capacity for one maximum-sized webhook; restore headroom without deleting unresolved evidence.

      - alert: WARuntimeWebhookSpoolCapacityHigh
        expr: |
          max(
            max(wa_runtime_webhook_spool_events{job="wa-runtime",state="stored"})
              / clamp_min(max(wa_runtime_webhook_spool_limit_events{job="wa-runtime"}), 1)
            or
            max(wa_runtime_webhook_spool_storage_bytes{job="wa-runtime"})
              / clamp_min(max(wa_runtime_webhook_spool_limit_bytes{job="wa-runtime"}), 1)
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime webhook spool capacity is high
          description: Event or byte utilization has exceeded 80 percent for ten minutes; diagnose stalled or dead work before admission is lost.

      - alert: WARuntimeWebhookProcessingStalled
        expr: wa_runtime_webhook_spool_oldest_active_age_seconds{job="wa-runtime"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime webhook processing is stalled
          description: The oldest pending or processing webhook has exceeded ten minutes; inspect scheduler recovery and processing leases.

      - alert: WARuntimeOpenWACircuitOpen
        expr: sum(wa_runtime_openwa_safety_scopes{job="wa-runtime",circuit_state="OPEN"}) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WA Runtime OpenWA safety circuit is open
          description: Repeated upstream pressure or ambiguous failures opened a durable safety circuit; do not bypass its cooldown or recovery probe.

      - alert: WARuntimeOpenWARecoveryStalled
        expr: sum(wa_runtime_openwa_safety_scopes{job="wa-runtime",circuit_state="HALF_OPEN"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime OpenWA recovery probe is stalled
          description: A safety scope has remained half-open for five minutes; inspect the recovery lease and worker heartbeat.

      - alert: WARuntimeOpenWAThrottlingPersistent
        expr: sum(wa_runtime_openwa_safety_scopes{job="wa-runtime",rate_mode="THROTTLED"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime OpenWA throttling persists
          description: One or more durable safety scopes have remained throttled for ten minutes; stop new campaigns and inspect upstream 429 pressure.

      - alert: WARuntimeOpenWADeferredQueueStalled
        expr: sum(wa_runtime_openwa_safety_deferred_message_jobs{job="wa-runtime"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime safety-deferred queue is not draining
          description: Message Jobs have remained deferred by a safety fence or rate budget for ten minutes; inspect cooldowns, scheduler health, and database time.

  - name: wa-runtime-http
    rules:
      - alert: WARuntimeHighHttpErrorRate
        expr: |
          (
            sum(rate(wa_runtime_http_requests_total{job="wa-runtime",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(wa_runtime_http_requests_total{job="wa-runtime"}[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(wa_runtime_http_requests_total{job="wa-runtime"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime HTTP 5xx rate is elevated
          description: More than five percent of Runtime requests have failed for ten minutes.

      - alert: WARuntimeHighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(wa_runtime_http_request_duration_seconds_bucket{job="wa-runtime"}[5m]))
          ) > 2
          and
          sum(rate(wa_runtime_http_request_duration_seconds_count{job="wa-runtime"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WA Runtime HTTP latency is elevated
          description: Aggregate p95 Runtime request latency has exceeded two seconds for ten minutes.
