route:
  receiver: telegram-production
  group_by: [alertname, job, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram-production
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: |-
          {{ .Status | toUpper }} · WA Studio production
          {{ range .Alerts }}{{ .Labels.severity }} · {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
