global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/runtime-alerts.yml

scrape_configs:
  - job_name: wa-runtime
    metrics_path: /api/v1/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/wa_runtime_metrics_token
    static_configs:
      - targets:
          - wa-runtime-api:3100
