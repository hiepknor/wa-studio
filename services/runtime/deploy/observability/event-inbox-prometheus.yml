global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/event-inbox-alerts.yml

scrape_configs:
  - job_name: wa-event-inbox
    metrics_path: /api/v1/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/wa_event_inbox_metrics_token
    static_configs:
      - targets:
          - event-inbox:34200
