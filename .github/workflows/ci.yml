name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file apps/studio/src-tauri/Cargo.lock
      - run: npm run check:security
      - run: npm run openwa:server:verify
      - name: Validate production observability configuration
        env:
          PROMTOOL_IMAGE: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          ALERTMANAGER_IMAGE: prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
          BLACKBOX_EXPORTER_IMAGE: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          CADDY_IMAGE: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
        run: |
          docker run --rm \
            -v "$PWD/services/runtime/deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/services/runtime/deploy/observability/runtime-alerts.yml:/etc/prometheus/rules/runtime-alerts.yml:ro" \
            -v "/dev/null:/run/secrets/wa_runtime_metrics_token:ro" \
            --entrypoint /bin/promtool \
            "$PROMTOOL_IMAGE" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/services/runtime/deploy/observability/event-inbox-prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/services/runtime/deploy/observability/event-inbox-alerts.yml:/etc/prometheus/rules/event-inbox-alerts.yml:ro" \
            -v "/dev/null:/run/secrets/wa_event_inbox_metrics_token:ro" \
            --entrypoint /bin/promtool \
            "$PROMTOOL_IMAGE" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/services/runtime/deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "/dev/null:/run/secrets/telegram_bot_token:ro" \
            -v "/dev/null:/run/secrets/telegram_chat_id:ro" \
            --entrypoint /bin/amtool \
            "$ALERTMANAGER_IMAGE" \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/services/runtime/deploy/observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro" \
            "$BLACKBOX_EXPORTER_IMAGE" \
            --config.file=/etc/blackbox_exporter/config.yml \
            --config.check
          docker run --rm \
            -e WA_EVENT_INBOX_UPSTREAM=127.0.0.1:34201 \
            -v "$PWD/services/runtime/deploy/event-inbox/Caddyfile.wa-events:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile
          docker compose \
            -f services/runtime/deploy/event-inbox/compose.yaml \
            -f services/runtime/deploy/event-inbox/observability.compose.yaml \
            --profile canary config --no-interpolate --quiet
      - run: npm run contract:check
      - run: npm run check:runtime
      - run: npm run test:integration
      - run: npm -w @wa/studio run check:frontend
      - run: docker build -f services/runtime/Dockerfile -t wa-event-inbox:ci .
      - run: git diff --check

  desktop:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: npm ci
      - name: Install Design System browser
        run: npx playwright install chromium
      - name: Validate Design System accessibility and visual baselines
        run: npm -w @wa/studio run design-system:check
      - run: npm -w @wa/studio run check:native
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:release
      - run: npm run build:desktop -- --debug
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Start isolated Event Inbox PostgreSQL
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          for _ in {1..60}; do
            "$(brew --prefix postgresql@17)/bin/pg_isready" && exit 0
            sleep 1
          done
          exit 1
      - name: Run packaged managed Runtime E2E
        run: |
          DATABASE_USER="$(whoami)"
          export DATABASE_URL="postgresql://${DATABASE_USER}@127.0.0.1:5432/postgres"
          export WA_STUDIO_APP_BINARY="$PWD/apps/studio/src-tauri/target/debug/bundle/macos/WA Studio.app/Contents/MacOS/wa-studio"
          npm run test:managed-runtime:event-inbox
