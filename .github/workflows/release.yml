name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file apps/studio/src-tauri/Cargo.lock
      - run: npm run check:release
      - name: Match product tag to Studio version
        run: |
          expected="v$(node -p "require('./apps/studio/package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Verify production promotion requirement
        env:
          PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM: ${{ vars.PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM }}
        run: |
          channel="$(node -p "require('./release/components.json').releaseChannel")"
          verification_args=()
          if [[ "$channel" == "stable" ]]; then
            test -n "$PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM"
            public_key="$RUNNER_TEMP/production-acceptance-public.pem"
            umask 077
            printf '%s\n' "$PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM" > "$public_key"
            verification_args=(--verification-public-key "$public_key")
          fi
          npm run release:promotion:verify-target -- \
            --receipt release/production-promotion.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --release-channel "$channel" \
            "${verification_args[@]}"
      - run: npm run contract:check
      - run: npm run check:connector
      - run: npm run check:runtime
      - run: npm run test:integration
      - run: npm -w @wa/studio run check:frontend

  event-inbox-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: registry
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wa-event-inbox" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable Event Inbox image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/runtime/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:${{ github.ref_name }}
            ${{ steps.registry.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest published Event Inbox image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.registry.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Record deployable digest
        run: printf '%s@%s\n' '${{ steps.registry.outputs.image }}' '${{ steps.image.outputs.digest }}' > event-inbox-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-inbox-image-${{ github.ref_name }}
          path: event-inbox-image.txt
          if-no-files-found: error

  connector-plugin:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:connector
      - name: Attest installable OpenWA connector
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: packages/openwa-connector-plugin/build/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wa-studio-connector-${{ github.ref_name }}
          path: |
            packages/openwa-connector-plugin/build/*.zip
            packages/openwa-connector-plugin/build/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-server-candidate:
    needs: [connector-plugin, event-inbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-inbox-image-${{ github.ref_name }}
          path: dist/server-release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wa-studio-connector-${{ github.ref_name }}
          path: dist/connector-plugin
      - name: Create server candidate deployment manifest
        run: |
          node tooling/release/deployment-release.mjs create-server \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/server-release/event-inbox-image.txt \
            --connector-directory dist/connector-plugin \
            --output dist/server-release/wa-studio-server-deployment.json
      - name: Attest server candidate deployment manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/server-release/wa-studio-server-deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wa-studio-server-release-${{ github.ref_name }}
          path: dist/server-release/**
          if-no-files-found: error
          retention-days: 14
      - name: Verify server candidate payload
        run: |
          node tooling/release/deployment-release.mjs verify-server \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/server-release/event-inbox-image.txt \
            --connector-directory dist/connector-plugin \
            --manifest dist/server-release/wa-studio-server-deployment.json
          connector_zip="$(find dist/connector-plugin -maxdepth 1 -type f -name '*.zip' -print -quit)"
          connector_checksum="${connector_zip}.sha256"
          test -n "$connector_zip" -a -f "$connector_checksum"
          (cd dist/connector-plugin && shasum -a 256 -c "$(basename "$connector_checksum")")
          gh attestation verify "$connector_zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify dist/server-release/wa-studio-server-deployment.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Event Inbox image provenance
        run: |
          image="$(tr -d '\r\n' < dist/server-release/event-inbox-image.txt)"
          gh attestation verify "oci://${image}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci
      - name: Create or resume server candidate draft
        id: server_candidate_release
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ -z "$state" ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "WA Studio $GITHUB_REF_NAME" --generate-notes
            state="true"
          fi
          if [[ "$state" == "true" ]]; then
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME is already published; server candidate upload is complete."
          fi
      - name: Upload and verify server candidate assets
        if: ${{ steps.server_candidate_release.outputs.is_draft == 'true' }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/server-release/* dist/connector-plugin/* --clobber
          mkdir -p dist/published-server-verification
          for asset in dist/server-release/* dist/connector-plugin/*; do
            name="$(basename "$asset")"
            gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir dist/published-server-verification
            cmp "$asset" "dist/published-server-verification/$name"
          done

  desktop:
    needs: [verify, connector-plugin]
    if: ${{ vars.WA_STUDIO_DESKTOP_RELEASE_ENABLED == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install App Store Connect private key
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_API_PRIVATE_KEY"
          install -m 600 /dev/null "$APPLE_API_KEY_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wa-studio-connector-${{ github.ref_name }}
          path: dist/connector-plugin
      - name: Pin connector package into the desktop release
        run: |
          connector_zip="$(find dist/connector-plugin -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$connector_zip" -a -f "${connector_zip}.sha256"
          expected="$(awk '{print $1}' "${connector_zip}.sha256")"
          actual="$(shasum -a 256 "$connector_zip" | awk '{print $1}')"
          test "$actual" = "$expected"
          asset="$(basename "$connector_zip")"
          printf '%s\n' "WA_STUDIO_CONNECTOR_PLUGIN_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset}#sha256=${actual}" >> "$GITHUB_ENV"
      - run: npm -w @wa/studio run check:native
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:release
      - name: Build signed desktop update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WA_STUDIO_UPDATER_ENDPOINT: ${{ secrets.WA_STUDIO_UPDATER_ENDPOINT }}
          WA_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.WA_STUDIO_UPDATER_PUBLIC_KEY }}
        run: npm run build:desktop:signed-update
      - name: Start isolated release-drill PostgreSQL
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          for _ in {1..60}; do
            "$(brew --prefix postgresql@17)/bin/pg_isready" && exit 0
            sleep 1
          done
          exit 1
      - name: Exercise signed packaged Runtime offline recovery and backup path
        run: |
          DATABASE_USER="$(whoami)"
          export DATABASE_URL="postgresql://${DATABASE_USER}@127.0.0.1:5432/postgres"
          export WA_STUDIO_APP_BINARY="$PWD/apps/studio/src-tauri/target/release/bundle/macos/WA Studio.app/Contents/MacOS/wa-studio"
          npm run test:managed-runtime:event-inbox
      - name: Generate desktop SPDX SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: .
          format: spdx-json
          output-file: dist/wa-studio.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Stage and verify updater release assets
        run: npm run release:stage-updater -- --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --sbom dist/wa-studio.spdx.json
      - name: Attest signed desktop release payload
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/updater-release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wa-studio-release-${{ github.ref_name }}
          path: dist/updater-release/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [publish-server-candidate, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wa-studio-release-${{ github.ref_name }}
          path: dist/updater-release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: event-inbox-image-${{ github.ref_name }}
          path: dist/release-metadata
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wa-studio-connector-${{ github.ref_name }}
          path: dist/connector-plugin
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wa-studio-server-release-${{ github.ref_name }}
          path: dist/server-release
      - name: Verify accepted canary promotion source
        env:
          PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM: ${{ vars.PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM }}
        run: |
          channel="$(node -p "require('./release/components.json').releaseChannel")"
          if [[ "$channel" == "canary" ]]; then
            exit 0
          fi
          test -n "$PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM"
          public_key="$RUNNER_TEMP/production-acceptance-public.pem"
          umask 077
          printf '%s\n' "$PRODUCTION_ACCEPTANCE_PUBLIC_KEY_PEM" > "$public_key"
          npm run release:promotion:verify-target -- \
            --receipt release/production-promotion.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --release-channel "$channel" \
            --verification-public-key "$public_key"
          accepted_tag="$(node -p "require('./release/production-promotion.json').acceptedRelease.tag")"
          accepted_commit="$(node -p "require('./release/production-promotion.json').acceptedRelease.gitCommit")"
          test "$(git rev-parse "${accepted_tag}^{commit}")" = "$accepted_commit"
          test "$(gh release view "$accepted_tag" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$accepted_tag" --json isPrerelease --jq '.isPrerelease')" = "true"
          mkdir -p dist/accepted-canary
          gh release download "$accepted_tag" \
            --pattern wa-studio-deployment.json \
            --dir dist/accepted-canary
          git worktree add --detach dist/accepted-source "$accepted_commit"
          node dist/accepted-source/tooling/release/production-promotion.mjs verify-source \
            --receipt release/production-promotion.json \
            --accepted-deployment dist/accepted-canary/wa-studio-deployment.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --policy dist/accepted-source/release/production-acceptance-policy.json \
            --verification-public-key "$public_key"
          node dist/accepted-source/tooling/release/production-promotion.mjs verify-delta \
            --receipt release/production-promotion.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --target-commit "$GITHUB_SHA" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --policy dist/accepted-source/release/production-acceptance-policy.json \
            --verification-public-key "$public_key"
          gh attestation verify dist/accepted-canary/wa-studio-deployment.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$accepted_commit"
      - name: Create coordinated deployment manifest
        run: |
          node tooling/release/deployment-release.mjs create \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/release-metadata/event-inbox-image.txt \
            --connector-directory dist/connector-plugin \
            --updater-directory dist/updater-release \
            --output dist/release-metadata/wa-studio-deployment.json
      - name: Attest coordinated deployment manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/release-metadata/wa-studio-deployment.json
      - name: Verify release payload
        run: |
          npm run release:verify-updater -- --directory dist/updater-release --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          cmp dist/release-metadata/event-inbox-image.txt dist/server-release/event-inbox-image.txt
          node tooling/release/deployment-release.mjs verify-server \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/server-release/event-inbox-image.txt \
            --connector-directory dist/connector-plugin \
            --manifest dist/server-release/wa-studio-server-deployment.json
          node tooling/release/deployment-release.mjs verify \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/release-metadata/event-inbox-image.txt \
            --connector-directory dist/connector-plugin \
            --updater-directory dist/updater-release \
            --manifest dist/release-metadata/wa-studio-deployment.json
          image="$(tr -d '\r\n' < dist/release-metadata/event-inbox-image.txt)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$image" =~ ^ghcr\.io/${owner}/wa-event-inbox@sha256:[0-9a-f]{64}$ ]]
          connector_zip="$(find dist/connector-plugin -maxdepth 1 -type f -name '*.zip' -print -quit)"
          connector_checksum="${connector_zip}.sha256"
          test -n "$connector_zip" -a -f "$connector_checksum"
          (cd dist/connector-plugin && shasum -a 256 -c "$(basename "$connector_checksum")")
          gh attestation verify "$connector_zip" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify dist/release-metadata/wa-studio-deployment.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify dist/server-release/wa-studio-server-deployment.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          for asset in dist/updater-release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Event Inbox image provenance
        run: |
          image="$(tr -d '\r\n' < dist/release-metadata/event-inbox-image.txt)"
          gh attestation verify "oci://${image}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci
      - name: Create or resume draft release
        id: coordinated_release
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ -z "$state" ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "WA Studio $GITHUB_REF_NAME" --generate-notes
            state="true"
          fi
          if [[ "$state" == "true" ]]; then
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME is already published; preserving its immutable assets."
          fi
      - name: Upload and verify draft assets
        if: ${{ steps.coordinated_release.outputs.is_draft == 'true' }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/updater-release/* dist/release-metadata/* dist/server-release/wa-studio-server-deployment.json dist/connector-plugin/* --clobber
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 12
          mkdir -p dist/published-verification
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir dist/published-verification
          cmp dist/updater-release/latest.json dist/published-verification/latest.json
      - name: Publish verified release
        if: ${{ steps.coordinated_release.outputs.is_draft == 'true' }}
        run: |
          channel="$(node -p "require('./release/components.json').releaseChannel")"
          if [[ "$channel" == "canary" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          elif [[ "$channel" == "stable" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            echo "Unsupported release channel: $channel" >&2
            exit 1
          fi
      - name: Verify immutable published product release
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 12
          rm -rf dist/published-product-release
          mkdir -p \
            dist/published-product-release/updater \
            dist/published-product-release/connector \
            dist/published-product-release/metadata
          node -e '
            const metadata = require("./dist/updater-release/release-assets.json");
            for (const name of Object.values(metadata.assets)) process.stdout.write(`${name}\n`);
          ' | while IFS= read -r asset; do
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$asset" \
              --dir dist/published-product-release/updater
          done
          connector_zip="$(find dist/connector-plugin -maxdepth 1 -type f -name '*.zip' -print -quit)"
          connector_name="$(basename "$connector_zip")"
          for asset in \
            "$connector_name" \
            "${connector_name}.sha256"; do
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$asset" \
              --dir dist/published-product-release/connector
          done
          for asset in \
            event-inbox-image.txt \
            wa-studio-server-deployment.json \
            wa-studio-deployment.json; do
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$asset" \
              --dir dist/published-product-release/metadata
          done
          npm run release:verify-updater -- \
            --directory dist/published-product-release/updater \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"
          (cd dist/published-product-release/connector && shasum -a 256 -c "${connector_name}.sha256")
          node tooling/release/deployment-release.mjs verify-server \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/published-product-release/metadata/event-inbox-image.txt \
            --connector-directory dist/published-product-release/connector \
            --manifest dist/published-product-release/metadata/wa-studio-server-deployment.json
          node tooling/release/deployment-release.mjs verify \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --image-file dist/published-product-release/metadata/event-inbox-image.txt \
            --connector-directory dist/published-product-release/connector \
            --updater-directory dist/published-product-release/updater \
            --manifest dist/published-product-release/metadata/wa-studio-deployment.json
          for asset in dist/published-product-release/updater/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          gh attestation verify \
            "dist/published-product-release/connector/$connector_name" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          for asset in \
            dist/published-product-release/metadata/wa-studio-server-deployment.json \
            dist/published-product-release/metadata/wa-studio-deployment.json; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          image="$(tr -d '\r\n' < dist/published-product-release/metadata/event-inbox-image.txt)"
          gh attestation verify "oci://${image}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci
      - name: Advance verified updater channel
        run: |
          channel="$(node -p "require('./release/components.json').releaseChannel")"
          if [[ "$channel" == "canary" ]]; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = "true"
            pointer_tag="wa-studio-canary"
            if ! gh release view "$pointer_tag" >/dev/null 2>&1; then
              gh release create "$pointer_tag" \
                --prerelease \
                --target "$GITHUB_SHA" \
                --title "WA Studio Canary Update Channel" \
                --notes "Mutable pointer to the latest verified, signed WA Studio canary release."
            fi
            gh release edit "$pointer_tag" --draft=false --prerelease=true
            gh release upload "$pointer_tag" dist/published-product-release/updater/latest.json --clobber
            rm -rf dist/channel-verification
            mkdir -p dist/channel-verification
            gh release download "$pointer_tag" --pattern latest.json --dir dist/channel-verification
            cmp dist/published-product-release/updater/latest.json dist/channel-verification/latest.json
          elif [[ "$channel" == "stable" ]]; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')" = "false"
          else
            echo "Unsupported release channel: $channel" >&2
            exit 1
          fi
